<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Digit Addition AI + Three.js Neurons</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(180deg, #eef3ff 0%, #f7f9fd 100%);
            color: #162033;
        }

        h1 {
            margin: 0 0 14px;
            font-size: 1.9rem;
            letter-spacing: -0.02em;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(320px, 1fr) minmax(260px, 320px);
            gap: 16px;
            align-items: start;
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(122, 145, 200, 0.18);
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(22, 34, 66, 0.08);
            padding: 16px;
            backdrop-filter: blur(6px);
        }

        #network3d {
            width: 100%;
            height: 460px;
            border-radius: 14px;
            overflow: hidden;
            background: linear-gradient(180deg, #f8fbff 0%, #edf3ff 100%);
            border: 1px solid rgba(122, 145, 200, 0.18);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            background: linear-gradient(180deg, #3a72ff 0%, #2459e6 100%);
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 6px 16px rgba(41, 98, 255, 0.22);
        }

        button:hover {
            background: linear-gradient(180deg, #2f67ff 0%, #1d4fcb 100%);
        }

        .stats, .predict-grid {
            display: grid;
            gap: 8px;
            margin-top: 12px;
        }

        .predict-grid {
            grid-template-columns: repeat(2, minmax(110px, 1fr));
            align-items: end;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.92rem;
            font-weight: 600;
            color: #41506f;
        }

        input[type="number"] {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #bfd0f0;
            border-radius: 10px;
            padding: 10px 11px;
            background: #fff;
            color: #162033;
            font-size: 1rem;
            font-weight: 700;
            box-shadow: inset 0 1px 2px rgba(14, 23, 40, 0.05);
        }

        input[type="number"]:focus {
            outline: 2px solid rgba(41, 98, 255, 0.2);
            border-color: #5b84ff;
        }

        .mono {
            font-family: Consolas, "Courier New", monospace;
            white-space: pre-wrap;
            line-height: 1.55;
            font-size: 0.95rem;
            background: #0b1220;
            color: #e4ecff;
            border-radius: 12px;
            padding: 12px;
            margin: 0;
            border: 1px solid rgba(120, 149, 224, 0.18);
        }

        .stats strong {
            font-size: 1.25rem;
            color: #0f1f3d;
        }

        .controls button {
            flex: 1 1 140px;
        }

        .predict-grid button {
            grid-column: 1 / -1;
            justify-self: stretch;
            margin-top: 2px;
        }
    </style>
</head>
<body>
<h1>Two-Digit Addition AI</h1>

<div class="layout">
    <section class="card">
        <div id="network3d" aria-label="3D neural network view"></div>
        <div class="controls">
            <button id="train-100">Train 100</button>
            <button id="train-1000">Train 1000</button>
            <button id="toggle-auto">Start Auto Train</button>
        </div>
        <div class="stats">
            <div>Samples trained: <strong id="sample-count">0</strong></div>
            <div>Latest batch MSE: <strong id="mse-value">0.0000</strong></div>
        </div>
    </section>

    <aside class="card">
        <div class="predict-grid">
            <div>
                <label for="input-a">Two-digit A</label>
                <input id="input-a" type="number" value="42" min="10" max="99" step="1">
            </div>
            <div>
                <label for="input-b">Two-digit B</label>
                <input id="input-b" type="number" value="57" min="10" max="99" step="1">
            </div>
            <button id="predict-btn">Predict A + B</button>
        </div>
        <div class="stats">
            <div>Expected sum: <strong id="expected-value">99</strong></div>
            <div>AI output: <strong id="prediction-value">0</strong></div>
            <div>Absolute error: <strong id="error-value">0</strong></div>
        </div>

        <h3>Neuron Weights</h3>
        <pre class="mono" id="weights-panel"></pre>
    </aside>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
